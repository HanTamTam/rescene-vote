name: Sync Rescene Notices

on:
  schedule:
    # 1) 오전 7시 40분 KST (UTC 22:40)
    - cron: '40 22 * * *'
    # 2) 오후 12시 10분 KST (UTC 03:10)
    - cron: '10 3 * * *'
    # 3) 오후 5시 50분 KST (UTC 08:50)
    - cron: '50 8 * * *'
    # 4) 오후 9시 50분 KST (UTC 12:50)
    - cron: '50 12 * * *'
  workflow_dispatch:
    inputs:
      notice_text:
        description: '추가할 공지 텍스트 (비워둘 경우 자동 점검)'
        required: false
        default: ''
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.title, 'sync')) ||
      (github.event_name == 'issues' && contains(github.event.issue.title, 'SYNC')) ||
      (github.event_name == 'issues' && contains(github.event.issue.title, '공지'))
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 공지 동기화 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Workflow Dispatch' }}
          ISSUE_BODY: ${{ github.event.inputs.notice_text || github.event.issue.body || '' }}
        run: |
          python scripts/sync_notices.py

      - name: 🛡️ 종합 자동 QA 및 무결성 E2E 검증 (QA & Health Guardrail)
        run: |
          python scripts/test_dashboard.py

      - name: 브랜치 생성 및 변경 사항 푸시
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "변경 사항이 없습니다."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            BRANCH_NAME="update/rescene-notices"
            git checkout -B $BRANCH_NAME
            git commit -m "Auto sync Rescene notices via Cloud Bot"
            git push origin $BRANCH_NAME --force
          fi

      - name: 📱 모바일 승인용 Pull Request(PR) 생성
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let qaReport = '';
            if (fs.existsSync('qa_report.md')) {
              qaReport = fs.readFileSync('qa_report.md', 'utf8');
            }

            const hasIssues = qaReport.includes('ATTENTION') || qaReport.includes('❌') || qaReport.includes('오류');
            const branch = 'update/rescene-notices';
            const title = hasIssues
              ? '⚠️ [점검 필요] RESCENE 최신 총공 업데이트 (QA 검토 후 병합 결정 필요)'
              : '📢 [검증 완료] RESCENE 최신 총공 및 투표 스케줄 업데이트';

            const noticeHeader = hasIssues
              ? `> 🚨 **[관리자 확인 요청] 자동 QA 검증에서 일부 점검 필요 항목이 발견되었습니다.**\n` +
                `> 아래 첨부된 리포트의 에러 상세 내역을 확인해 주세요.\n` +
                `> 일시적 링크 지연이거나 배포에 문제없다고 판단되시면 **그럼에도 불구하고 [Merge pull request]를 눌러 배포를 강행**하실 수 있습니다.\n\n`
              : '';

            const body = `## 📢 RESCENE (리센느) 최신 공지 업데이트 알림 ✨\n\n` +
                         noticeHeader +
                         `클라우드 봇이 최신 공지 및 스트리밍·투표 일정을 감지하여 대시보드 코드를 업데이트했습니다.\n\n` +
                         `* **반영 파일**: \`index.html\`, \`rescene_voting_schedule.html\`, \`mma_alliance_voting_notice.md\`\n` +
                         `* **📱 모바일 원터치 승인**: 검토 후 아래 초록색 **[Merge pull request]** 버튼을 탭하시면 라이브 웹 대시보드에 즉시 배포됩니다! 🚀\n\n` +
                         (qaReport ? `---\n\n` + qaReport : '');

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'main',
              state: 'open'
            });

            if (pulls.data.length === 0) {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: branch,
                base: 'main',
                body: body
              });
              console.log('✅ 새 PR 생성 완료: #' + pr.data.number);
            } else {
              console.log('ℹ️ 이미 오픈된 PR이 있습니다: #' + pulls.data[0].number);
            }

      - name: 이슈 자동 완료 댓글 및 Close 처리
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 **공지 동기화 PR이 생성되었습니다!**\n\nGitHub 앱의 [Pull Requests] 탭에서 확인 후 승인(Merge)하시면 즉시 배포됩니다.'
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
