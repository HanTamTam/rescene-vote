<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar-kgma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="bar-mama" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="bar-melon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar-kb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar-alliance" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">RESCENE (리센느) 투표 &amp; 총공 일정 간트 차트</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">2026 어워즈 투표 및 음반 총공 타임라인 (10월 중순 ~ 11월 중순)</text>

  <!-- Timeline Grid Area: Left=230, Right=850, Width=620, Height=320, Top=100 -->
  <rect x="230" y="100" width="620" height="300" rx="8" fill="#1e293b" fill-opacity="0.6"/>

  <!-- Grid Vertical Lines & Date Labels (Total 30 Days: 10/15 to 11/13, 620px) -->
  <!-- Day width = 620 / 30 = 20.67 px/day -->
  <!-- 10/15 (Day 0): x=230 -->
  <!-- 10/17 (Day 2 - TODAY): x=230 + 41.3 = 271.3 -->
  <!-- 10/20 (Day 5 - KGMA): x=230 + 103.3 = 333.3 -->
  <!-- 10/22 (Day 7 - MAMA): x=230 + 144.7 = 374.7 -->
  <!-- 10/29 (Day 14 - MMA TOP10): x=230 + 289.3 = 519.3 -->
  <!-- 10/30 (Day 15 - KB & Alliance start): x=230 + 310 = 540 -->
  <!-- 11/03 (Day 19 - PULSE): x=230 + 392.7 = 622.7 -->
  <!-- 11/13 (Day 29 - End): x=230 + 620 = 850 -->

  <g stroke="#334155" stroke-width="1" stroke-dasharray="3,3">
    <line x1="230" y1="100" x2="230" y2="400"/>
    <line x1="333" y1="100" x2="333" y2="400"/>
    <line x1="375" y1="100" x2="375" y2="400"/>
    <line x1="519" y1="100" x2="519" y2="400"/>
    <line x1="540" y1="100" x2="540" y2="400"/>
    <line x1="623" y1="100" x2="623" y2="400"/>
    <line x1="850" y1="100" x2="850" y2="400"/>
  </g>

  <!-- Date Headers -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
    <text x="230" y="92">10/15</text>
    <text x="333" y="92">10/20(KGMA)</text>
    <text x="375" y="92">10/22(MAMA)</text>
    <text x="519" y="92">10/29(MMA)</text>
    <text x="540" y="92">10/30</text>
    <text x="623" y="92">11/03</text>
    <text x="850" y="92">11/13</text>
  </g>

  <!-- TODAY Indicator (Red Line & Badge) -->
  <line x1="271" y1="80" x2="271" y2="405" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="none"/>
  <rect x="236" y="65" width="70" height="20" rx="10" fill="#ef4444"/>
  <text x="271" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">📍 오늘(10/17)</text>

  <!-- Gantt Rows -->
  <!-- Row 1: KGMA Berriz -->
  <text x="215" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">KGMA Berriz 투표</text>
  <rect x="230" y="115" width="103" height="26" rx="6" fill="url(#bar-kgma)" filter="url(#shadow)"/>
  <text x="281" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">D-3 마감 (~10/20)</text>

  <!-- Row 2: MAMA 1st Round -->
  <text x="215" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">MAMA 1차 투표 (Top20)</text>
  <rect x="230" y="163" width="145" height="26" rx="6" fill="url(#bar-mama)" filter="url(#shadow)"/>
  <text x="302" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">D-5 마감 (~10/22)</text>

  <!-- Row 3: Melon MMA TOP 10 -->
  <text x="215" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">멜론 MMA TOP10</text>
  <rect x="230" y="211" width="289" height="26" rx="6" fill="url(#bar-melon)" filter="url(#shadow)"/>
  <text x="374" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">매일 투표 진행 중 (~10/29)</text>

  <!-- Row 4: KakaoBank Special Award -->
  <text x="215" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">카뱅 모두의 스타상</text>
  <rect x="230" y="259" width="310" height="26" rx="6" fill="url(#bar-kb)" filter="url(#shadow)"/>
  <text x="385" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#191600" text-anchor="middle">투표 80% 반영 (~10/30)</text>

  <!-- Row 5: PULSE Album Pre-order -->
  <text x="215" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">미니4집 [PULSE] 공구</text>
  <rect x="230" y="307" width="393" height="26" rx="6" fill="url(#bar-pulse)" filter="url(#shadow)"/>
  <text x="426" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">케타포 공구 특전 (~11/03)</text>

  <!-- Row 6: MMA ALYZ Alliance -->
  <text x="215" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">MMA 알디원 연합</text>
  <rect x="540" y="355" width="310" height="26" rx="6" fill="url(#bar-alliance)" filter="url(#shadow)"/>
  <text x="695" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">10/30 본상 오픈 시 개시 (~11/13)</text>

  <!-- Legend Bar -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" transform="translate(40, 435)">
    <circle cx="10" cy="5" r="5" fill="#a855f7"/>
    <text x="22" y="9">KGMA</text>
    <circle cx="90" cy="5" r="5" fill="#e11d48"/>
    <text x="102" y="9">MAMA</text>
    <circle cx="170" cy="5" r="5" fill="#10b981"/>
    <text x="182" y="9">멜론TOP10</text>
    <circle cx="270" cy="5" r="5" fill="#fbbf24"/>
    <text x="282" y="9">카뱅특별상</text>
    <circle cx="370" cy="5" r="5" fill="#0284c7"/>
    <text x="382" y="9">앨범공구</text>
    <circle cx="460" cy="5" r="5" fill="#6366f1"/>
    <text x="472" y="9">MMA연합</text>
    <rect x="560" y="0" width="10" height="10" rx="2" fill="#ef4444"/>
    <text x="576" y="9" font-weight="700" fill="#f87171">오늘 기준선 (10/17)</text>
  </g>
</svg>
